name: Refresh Codental Session

on:
  schedule:
    - cron: '0 */8 * * *'  # a cada 8 horas
  workflow_dispatch:          # permite rodar manualmente

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install playwright mongodb

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      # O Turnstile do login do Codental exige navegador com janela: roda sob display virtual.
      # Se falhar, a extensão do Chrome (Doctoralia turbo) também envia a sessão ao mesmo registro.
      - name: Refresh Codental session
        env:
          CODENTAL_EMAIL: ${{ secrets.CODENTAL_EMAIL }}
          CODENTAL_PASSWORD: ${{ secrets.CODENTAL_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CODENTAL_OLD_EMAIL: ${{ secrets.CODENTAL_OLD_EMAIL }}
          CODENTAL_OLD_PASSWORD: ${{ secrets.CODENTAL_OLD_PASSWORD }}
          CODENTAL_OLD_ESTABLISHMENT_ID: ${{ secrets.CODENTAL_OLD_ESTABLISHMENT_ID }}
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" node .github/scripts/refresh-session.js

      - name: Auto-resolver pendências com prontuário 100% batido
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -sf -X POST "https://codental-monitor.vercel.app/api/review" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_KEY:-Deuse10}" \
            -d '{"action":"auto_resolve"}'
