name: Refresh Codental Session

on:
  schedule:
    - cron: '0 */8 * * *'  # a cada 8 horas
  workflow_dispatch:          # permite rodar manualmente

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # inclui até 8 min por conta esperando o código respondido no WhatsApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install playwright mongodb

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      # Tentativa: o IP de datacenter do GitHub costuma ser barrado pelo Turnstile (21/10/2026).
      # Não derruba o job; a sessão vem da extensão do Chrome (ou de uma tarefa agendada no PC).
      - name: Refresh Codental session
        continue-on-error: true
        env:
          CODENTAL_EMAIL: ${{ secrets.CODENTAL_EMAIL }}
          CODENTAL_PASSWORD: ${{ secrets.CODENTAL_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CODENTAL_OLD_EMAIL: ${{ secrets.CODENTAL_OLD_EMAIL }}
          CODENTAL_OLD_PASSWORD: ${{ secrets.CODENTAL_OLD_PASSWORD }}
          CODENTAL_OLD_ESTABLISHMENT_ID: ${{ secrets.CODENTAL_OLD_ESTABLISHMENT_ID }}
          GESTAO_URL: ${{ secrets.GESTAO_URL }}
          GESTAO_TOKEN: ${{ secrets.GESTAO_TOKEN }}
          # Verificação em duas etapas: o código do SMS é pedido por WhatsApp (Evolution API do CRM)
          CODENTAL_2FA_PHONE: '6199611055'
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
        run: xvfb-run -a --server-args="-screen 0 1366x768x24" node .github/scripts/refresh-session.js

      # Mostra o que a Cloudflare exibiu ao runner quando o login é bloqueado
      - name: Captura do Turnstile (se falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-falhou
          path: turnstile-falhou-*.png
          if-no-files-found: ignore

      - name: Auto-resolver pendências com prontuário 100% batido
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -sf -X POST "https://codental-monitor.vercel.app/api/review" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_KEY:-Deuse10}" \
            -d '{"action":"auto_resolve"}'
